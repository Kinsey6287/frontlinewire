name: Update FrontlineWire

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    # This keeps the site fresh without burning API credits.
    # To change frequency, adjust the cron below.
    #   Every 4 hours:  '0 */4 * * *'
    #   Every 2 hours:  '0 */2 * * *'
    #   Every hour:     '0 * * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic feedparser python-dateutil

      - name: Run update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 update.py

      - name: Commit and push data.json
        run: |
          git config user.name  "FrontlineWire Bot"
          git config user.email "bot@frontlinewire.news"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
